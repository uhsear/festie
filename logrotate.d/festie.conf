# Logrotate template for Festie application logs
#
# Runs as a user-level config, not from /etc/logrotate.d. Logrotate does not
# expand ~ or environment variables, so replace the placeholder below with an
# absolute path first:
#   /path/to/festie    the app directory that holds logs/ (see scripts/backup-cron.example)
# Install: cp logrotate.d/festie.conf ~/.config/logrotate-festie.conf
# Test:    logrotate -d -s ~/.config/logrotate-festie.state ~/.config/logrotate-festie.conf  (dry run)
# Cron:    0 4 * * * /usr/sbin/logrotate -s ~/.config/logrotate-festie.state ~/.config/logrotate-festie.conf
#
# PM2 application logs (pm2-out.log, pm2-error.log) are NOT listed here.
# pm2-logrotate rotates them and keeps 14 days; rotating them here too would
# rotate the same files twice. Retention policy for all Festie logs: 14 days.

# Cron job logs (health checks, alerts, backups)
/path/to/festie/logs/health-check.log
/path/to/festie/logs/health-alerts.log
/path/to/festie/logs/alert.log
/path/to/festie/logs/backup.log
/path/to/festie/logs/backup-offsite.log
/path/to/festie/logs/backup-restore-drill.log
/path/to/festie/logs/backup-festival.log
/path/to/festie/logs/metrics-rollup.log
/path/to/festie/logs/audit-log-cleanup.log
/path/to/festie/logs/log-cleanup.log
{
    weekly
    rotate 2
    compress
    delaycompress
    missingok
    notifempty
    copytruncate
    maxsize 20M
    dateext
    dateformat -%Y%m%d
}
