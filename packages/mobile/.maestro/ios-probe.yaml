# TEMPORARY probe (gap/ios): bare screen, one Text + one Pressable.
appId: us.festie.app
---
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible:
      id: "probe-text"
    timeout: 60000
- tapOn:
    id: "probe-btn"
- extendedWaitUntil:
    visible:
      id: "probe-done"
    timeout: 10000
