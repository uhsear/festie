# EAS Workflow: build the iOS app for the Simulator on Expo's macOS cloud workers,
# then run the Maestro smoke flow against it — automated iOS UI testing with NO Mac.
# Run manually from Windows:  npx eas-cli@latest workflow:run .eas/workflows/e2e-ios.yml
#
# Manual only. The weekly schedule was removed on 2026-10-29: a scheduled run builds
# from the GitHub checkout, and the Clash Display font files are not in the public
# repository (licence), so metro cannot bundle the app there. `workflow:run` from a
# local checkout uploads the fonts fetched by `node scripts/fetch-fonts.mjs`.
# Each run consumes one iOS build; the EAS free tier allows 15/month.
# Still no `pull_request`/`push` trigger — an iOS build per push would exhaust the
# month's allowance in a day.
#
# This is deliberately NOT a GitHub Actions job. GitHub-hosted macOS runners bill
# private repos at a 10x minute multiplier ($0.062/min), whereas this runs on Expo's
# own macOS infrastructure inside the plan already being paid for. A duplicate
# GitHub Actions nightly (.github/workflows/ios-e2e-nightly.yml) was removed
# 2026-08-19 for exactly that reason.
name: e2e-ios

on:
  workflow_dispatch: {}

jobs:
  build_ios_for_e2e:
    type: build
    params:
      platform: ios
      profile: e2e-test
  maestro_test:
    needs: [build_ios_for_e2e]
    type: maestro
    # Binds the EAS `preview` env so TEST_USERNAME / TEST_PASSWORD (EAS secret env
    # vars) are available to the Maestro flow for the authed-screen coverage.
    environment: preview
    env:
      MAESTRO_TEST_USERNAME: ${{ env.TEST_USERNAME }}
      MAESTRO_TEST_PASSWORD: ${{ env.TEST_PASSWORD }}
    params:
      build_id: ${{ needs.build_ios_for_e2e.outputs.build_id }}
      flow_path: ['.maestro/ios-smoke.yaml']
