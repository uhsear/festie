name: Web load smoke

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:
    inputs:
      base_url:
        description: Site to load (override only to force a failure and test the alert)
        required: false
        default: https://festie.us
        type: string

# Catches a web app that never mounts while the API still answers 200. A failed
# run on main opens (or reuses) a "Web load smoke failing" issue labelled
# web-load-smoke, which also notifies the repository owner; the next green run on
# main closes it. Same pattern as e2e-web.yml. A repeat failure does not comment
# again: the run is every 30 minutes, so a long outage would otherwise post 48
# comments a day.

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

permissions:
  contents: read
  issues: write

jobs:
  web-load-smoke:
    # Pinned: Playwright browsers do not install or launch on ubuntu-26.04, which ubuntu-latest became in 2026-11.
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
        timeout-minutes: 5
      - name: Load the live site anonymously
        run: npx playwright test tests/e2e/web-load-smoke.spec.ts --project=chromium
        env:
          BASE_URL: ${{ inputs.base_url || 'https://festie.us' }}

      # The alert belongs to runs on main: a dispatch on a branch cannot open or close it.
      # Only a run against the live site may close the issue: a green run against another
      # site says nothing about festie.us.
      # Housekeeping only: a GitHub API blip here must not turn a green run red.
      - name: Close any open failing issue (site loads)
        if: success() && github.ref == 'refs/heads/main' && (inputs.base_url || 'https://festie.us') == 'https://festie.us'
        continue-on-error: true
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const title = 'Web load smoke failing';
            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'web-load-smoke',
              per_page: 10,
            });
            for (const issue of issues.filter(i => i.title === title)) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                body: `The site loaded again at ${new Date().toUTCString()}.`,
              });
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                state: 'closed',
              });
              core.info(`Closed issue #${issue.number}`);
            }

      - name: Open failing issue (site does not load)
        if: failure() && github.ref == 'refs/heads/main'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          TESTED_URL: ${{ inputs.base_url || 'https://festie.us' }}
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const title = 'Web load smoke failing';
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'web-load-smoke',
              per_page: 10,
            });
            const existing = issues.find(i => i.title === title);
            if (existing) {
              core.info(`Issue #${existing.number} is already open`);
              return;
            }
            const { data: newIssue } = await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title,
              labels: ['web-load-smoke'],
              body: [
                '## The live site does not load',
                '',
                `The web load smoke run failed at **${new Date().toUTCString()}** while loading ${process.env.TESTED_URL}.`,
                '',
                `[View failing run](${runUrl})`,
                '',
                '_This issue closes automatically when the next run on main passes against the live site._',
              ].join('\n'),
            });
            core.info(`Opened new issue #${newIssue.number}`);
