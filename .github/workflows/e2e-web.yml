name: E2E Web (nightly)

on:
  schedule:
    # 07:30 UTC daily
    - cron: '30 7 * * *'
  workflow_dispatch:
    inputs:
      update_snapshots:
        description: Generate reviewed Linux responsive baselines instead of comparing
        required: false
        default: false
        type: boolean

# Non-blocking by nature: scheduled workflow, not wired into branch protection.
# Failures surface in the Actions tab and notification emails only.

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

permissions:
  contents: read

jobs:
  e2e-web:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_password
          POSTGRES_DB: festie_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Fetch licensed fonts (private repo; see scripts/fetch-fonts.mjs)
        run: node scripts/fetch-fonts.mjs
        env:
          FESTIE_FONTS_SSH_KEY: ${{ secrets.FESTIE_FONTS_SSH_KEY }}
      - uses: ./.github/actions/pnpm-setup
        with:
          node-cache: 'npm'

      - name: Install root deps
        run: npm ci

      - name: Install workspace deps
        working-directory: packages
        run: pnpm install --frozen-lockfile

      # `playwright install --with-deps` hung for 44 minutes in two nightly runs
      # (40511916565, 39955399825) until the job timeout cancelled them. Split
      # it so each network-bound step is cached or bounded and retried: browser
      # binaries come from the cache, and apt/download work gets a 5-minute cap
      # per attempt.
      - name: Resolve Playwright version
        id: playwright-version
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ steps.playwright-version.outputs.version }}

      - name: Install Playwright system dependencies
        timeout-minutes: 16
        run: |
          for attempt in 1 2 3; do
            timeout 300 npx playwright install-deps chromium firefox webkit && exit 0
            echo "install-deps attempt $attempt failed or timed out"
          done
          exit 1

      - name: Install Playwright browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        timeout-minutes: 16
        run: |
          for attempt in 1 2 3; do
            timeout 300 npx playwright install chromium firefox webkit && exit 0
            echo "install attempt $attempt failed or timed out"
          done
          exit 1

      - name: Apply database migrations
        env:
          TEST_DATABASE_URL: postgres://test_user:test_password@localhost:5432/festie_test
        run: |
          for migration in migrations/*.sql; do
            PGPASSWORD=test_password psql -h localhost -U test_user -d festie_test -f "$migration"
          done

      - name: Build web frontend
        working-directory: packages
        run: pnpm --filter @festie/web build

      - name: Run functional and accessibility E2E (browser matrix)
        if: ${{ !inputs.update_snapshots }}
        env:
          DATABASE_URL: postgres://test_user:test_password@localhost:5432/festie_test
          TEST_DATABASE_URL: postgres://test_user:test_password@localhost:5432/festie_test
          PLAYWRIGHT_ARTIFACT_DIR: output/playwright/browser-matrix
        run: >-
          npx playwright test
          --project=chromium --project=firefox --project=webkit
          tests/e2e/festival-planner.spec.ts
          tests/e2e/accessibility.spec.ts
          tests/e2e/reduced-motion.spec.ts

      - name: Run responsive visual regression (chromium)
        if: always()
        env:
          DATABASE_URL: postgres://test_user:test_password@localhost:5432/festie_test
          TEST_DATABASE_URL: postgres://test_user:test_password@localhost:5432/festie_test
          PLAYWRIGHT_ARTIFACT_DIR: output/playwright/responsive
          UPDATE_SNAPSHOTS: ${{ inputs.update_snapshots || 'false' }}
        run: |
          args=()
          if [[ "$UPDATE_SNAPSHOTS" == "true" ]]; then
            args+=(--update-snapshots)
          fi
          npx playwright test --project=chromium tests/e2e/responsive-design.spec.ts "${args[@]}"

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: output/playwright/
          retention-days: 14

      - name: Upload generated responsive baselines
        if: ${{ always() && inputs.update_snapshots }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: responsive-linux-baselines
          path: tests/__snapshots__/responsive-design.spec.ts/*.png
          if-no-files-found: error
          retention-days: 7
