name: iOS E2E

# Free (public-repo macOS minutes), EAS-credit-free iOS end-to-end smoke.
#
# Mirrors android-e2e.yml: builds a *local Release .app* for the iOS Simulator on
# the runner (no EAS build) and drives it with Maestro 2.6.0 — the same harness
# used for Android. A Release simulator build embeds the Hermes JS bundle so it's
# self-contained (a Debug build would need a Metro dev server CI doesn't have) and
# installs without code signing.
#
# Runs weekly on main (Sunday 04:00 UTC) so a mobile regression shows up without a manual
# dispatch. It is not on every push: it is a ~20-25min build+sim job. Run it on demand from the
# Actions tab, or:
#   gh workflow run ios-e2e.yml --ref <branch>
#   gh workflow run ios-e2e.yml --ref <branch> -f ref=<git ref to build> -f run_maestro=false
#
# It is also the reusable simulator build (workflow_call): with upload_app=true it uploads the zipped
# simulator .app (1-day retention) as the artifact ios-simulator-app-<short sha>. ios-sim-session.yml calls it with
# run_maestro=false, then streams that .app in a browser. `ref` picks what to build (default: the
# ref the run started on); `run_maestro` turns the boot-and-test half off (the scheduled run
# always runs it).
on:
  schedule:
    - cron: '0 4 * * 0'
  workflow_dispatch:
    inputs:
      ref:
        description: 'Git ref (branch, tag or sha) to build; empty builds the ref the run started on'
        type: string
        default: ''
      run_maestro:
        description: 'Boot the simulator and run the Maestro flows after the build'
        type: boolean
        default: true
      probe:
        description: 'TEMPORARY: replace the app with a bare probe screen and run the probe flow'
        type: boolean
        default: false
      probe_mode:
        description: 'TEMPORARY: bare | no-intro | stack | tabs | bisect'
        type: string
        default: 'bare'
  workflow_call:
    inputs:
      ref:
        description: 'Git ref (branch, tag or sha) to build; empty builds the caller ref'
        type: string
        default: ''
      run_maestro:
        description: 'Boot the simulator and run the Maestro flows after the build'
        type: boolean
        default: false
      upload_app:
        description: 'Upload the zipped simulator .app (only a session needs it)'
        type: boolean
        default: false
    outputs:
      artifact_name:
        description: 'Name of the artifact that holds the zipped simulator .app'
        value: ${{ jobs.ios-e2e.outputs.artifact_name }}

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'
  EXPO_NO_TELEMETRY: '1'
  # Release simulator builds shouldn't upload to Sentry from CI; keep the plugin quiet.
  SENTRY_DISABLE_AUTO_UPLOAD: 'true'

permissions:
  contents: read
  # Required by dorny/test-reporter to post JUnit check annotations on the run.
  checks: write
  actions: read

jobs:
  ios-e2e:
    runs-on: macos-15
    timeout-minutes: 60
    outputs:
      artifact_name: ${{ steps.app.outputs.artifact_name }}
    env:
      # inputs.* is empty on a scheduled run, which always runs Maestro.
      RUN_MAESTRO: ${{ github.event_name == 'schedule' || inputs.run_maestro }}
    steps:
      # Expo SDK 56+'s precompiled XCFrameworks ship a Package.swift declaring
      # `swift-tools-version: 6.2`, which xcodebuild can only resolve with a
      # Swift 6.2 toolchain. The macos-15 image's DEFAULT Xcode is 16.4 (Swift
      # 6.1) and fails SPM resolution ("package 'apple' is using Swift tools
      # version 6.2.0 but the installed version is 6.1.0"). Select the newest
      # Xcode the image has installed (16.x/26 ships Swift 6.2) before building.
      - name: Select newest installed Xcode (need Swift >= 6.2)
        run: |
          NEWEST=$(ls -d /Applications/Xcode_*.app 2>/dev/null \
            | sort -t_ -k2 -V | tail -1)
          if [ -z "$NEWEST" ]; then
            NEWEST=/Applications/Xcode.app
          fi
          echo "Selecting $NEWEST"
          sudo xcode-select -s "$NEWEST/Contents/Developer"
          xcodebuild -version
          swift --version

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
      - name: Fetch licensed fonts (private repo; see scripts/fetch-fonts.mjs)
        run: node scripts/fetch-fonts.mjs
        env:
          FESTIE_FONTS_SSH_KEY: ${{ secrets.FESTIE_FONTS_SSH_KEY }}

      - name: Require smoke-test credentials
        if: env.RUN_MAESTRO == 'true'
        env:
          TEST_USERNAME: ${{ secrets.TEST_USERNAME }}
          TEST_PASSWORD: ${{ secrets.TEST_PASSWORD }}
        run: |
          test -n "$TEST_USERNAME" || { echo "::error::TEST_USERNAME is not configured"; exit 1; }
          test -n "$TEST_PASSWORD" || { echo "::error::TEST_PASSWORD is not configured"; exit 1; }

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          version: 10
          run_install: false

      # ── Caches ───────────────────────────────────────────────────────────────
      # ios/ is generated by prebuild (gitignored), so Podfile.lock doesn't exist
      # at checkout. Key on the pnpm lockfile + app.json (the two inputs that
      # control what pod versions prebuild will write into Podfile.lock) so the
      # cache is busted on any relevant dependency change. restore-keys falls
      # back to the most recent same-OS pod cache on a key miss.
      - name: Get pnpm store path
        id: pnpm-store-path
        run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"

      - name: Cache pnpm store
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.pnpm-store-path.outputs.path }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('packages/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Cache CocoaPods
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            packages/mobile/ios/Pods
            ~/Library/Caches/CocoaPods
          key: ${{ runner.os }}-pods-${{ hashFiles('packages/pnpm-lock.yaml', 'packages/mobile/app.json') }}
          restore-keys: |
            ${{ runner.os }}-pods-

      - name: Install workspace deps (pnpm)
        working-directory: packages
        run: pnpm install --frozen-lockfile

      # Boot the simulator BEFORE the long native build so it's warm and ready by
      # the time the .app is built. macos-15 is Apple Silicon (M-series), Xcode 16+.
      # No UDID pinning (macos-15 had a device-matching regression) — match by model.
      # NOTE: v5 is the action's latest release and still targets node20; that
      # deprecation warning is upstream (FORCE_JAVASCRIPT_ACTIONS_TO_NODE24 keeps
      # it running). os_version >=18.5 narrows the match — >=17.0 matched 5
      # devices and warned about the ambiguity.
      - name: Boot iOS Simulator
        id: sim
        if: env.RUN_MAESTRO == 'true'
        uses: futureware-tech/simulator-action@c768f52966d5f70335ec77881f9806b24a52f80e # v6
        with:
          model: 'iPhone 16 Pro'
          os: 'iOS'
          os_version: '>=18.5'
          wait_for_boot: true
          boot_timeout_seconds: 180
          boot_retries: 3

      - name: Drop the first-run intro (TEMPORARY)
        if: inputs.probe == true && inputs.probe_mode == 'no-intro'
        working-directory: packages/mobile
        run: |
          sed -i '' 's|<FirstRunIntro onDone={dismissIntro} />|null|' app/_layout.tsx
          grep -c 'FirstRunIntro onDone' app/_layout.tsx || true

      - name: Patch launch-argument bisect gates (TEMPORARY)
        if: inputs.probe == true && inputs.probe_mode == 'bisect'
        working-directory: packages/mobile
        run: python3 .maestro/probe/apply-bisect.py

      - name: Swap in router probe app (TEMPORARY)
        if: inputs.probe == true && (inputs.probe_mode == 'stack' || inputs.probe_mode == 'tabs')
        working-directory: packages/mobile
        run: |
          P=.maestro/probe
          find app -mindepth 1 -maxdepth 1 ! -name _layout.tsx -exec rm -r {} +
          cp $P/stack-layout.tsx app/_layout.tsx
          if [ "${{ inputs.probe_mode }}" = "stack" ]; then
            cp $P/probe-screen.tsx app/index.tsx
          else
            mkdir -p "app/(tabs)"
            cp $P/tabs-layout.tsx "app/(tabs)/_layout.tsx"
            cp $P/probe-screen.tsx "app/(tabs)/index.tsx"
            cp $P/probe-screen.tsx "app/(tabs)/two.tsx"
          fi

      - name: Swap in bare probe app (TEMPORARY)
        if: inputs.probe == true && inputs.probe_mode == 'bare'
        working-directory: packages/mobile
        run: |
          cat > app/_layout.tsx <<'EOT'
          import { useState } from 'react';
          import { Pressable, Text, View } from 'react-native';
          export default function ProbeLayout() {
            const [done, setDone] = useState(false);
            return (
              <View style={{ flex: 1, justifyContent: 'center', alignItems: 'center', backgroundColor: '#000' }}>
                <Text testID="probe-text" style={{ color: '#fff', fontSize: 24 }}>Probe</Text>
                <Pressable testID="probe-btn" onPress={() => setDone(true)} style={{ padding: 20, backgroundColor: '#0aa', marginTop: 20 }}>
                  <Text style={{ color: '#fff' }}>Tap me</Text>
                </Pressable>
                {done ? <Text testID="probe-done" style={{ color: '#fff', marginTop: 20 }}>Done</Text> : null}
              </View>
            );
          }
          EOT

      # Generate the native ios/ project (CNG; ios/ is gitignored).
      # --no-install: pnpm already installed node_modules; don't let prebuild shell
      # out to npm and fight the pnpm layout. CocoaPods is installed separately below.
      - name: Expo prebuild (ios)
        working-directory: packages/mobile
        run: pnpm exec expo prebuild --platform ios --no-install

      # Prebuild may emit a Gemfile (bundler-managed CocoaPods). If it did, use the
      # pinned `bundle exec pod`; otherwise fall back to the system `pod`.
      - name: CocoaPods install
        working-directory: packages/mobile/ios
        run: |
          if [ -f ../Gemfile ]; then
            (cd .. && bundle install)
            bundle exec --gemfile=../Gemfile pod install
          elif [ -f Gemfile ]; then
            bundle install
            bundle exec pod install
          else
            pod install
          fi

      # Discover the workspace + scheme dynamically rather than hardcoding "Festie"
      # (the Expo scheme/workspace name can change between SDK templates).
      - name: Detect workspace and scheme
        id: xcode
        working-directory: packages/mobile/ios
        run: |
          WORKSPACE=$(ls -d *.xcworkspace | head -1)
          if [ -z "$WORKSPACE" ]; then
            echo "::error::No .xcworkspace found in packages/mobile/ios after pod install."
            exit 1
          fi
          # The workspace bundles the app scheme PLUS Pod-provided helper schemes
          # (Pods, and — because expo-dev-client is a dep — EASClient). Building
          # EASClient is wrong: it's the dev-launcher helper, not the app, and it
          # fails the ExpoModulesJSI xcframework script phase. Prefer the scheme
          # named after the workspace (the app target Expo generates), then fall
          # back to the first scheme that is not a known helper.
          WS_NAME="${WORKSPACE%.xcworkspace}"
          SCHEME=$(xcodebuild -workspace "$WORKSPACE" -list -json \
            | WS_NAME="$WS_NAME" python3 -c "import sys,json,os; ss=json.load(sys.stdin)['workspace']['schemes']; ws=os.environ['WS_NAME']; h={'Pods','EASClient'}; print(ws if ws in ss else next((s for s in ss if s not in h), ''))")
          if [ -z "$SCHEME" ]; then
            echo "::error::Could not determine a build scheme from xcodebuild -list."
            exit 1
          fi
          echo "workspace=$WORKSPACE" >> "$GITHUB_OUTPUT"
          echo "scheme=$SCHEME" >> "$GITHUB_OUTPUT"
          echo "Using workspace=$WORKSPACE scheme=$SCHEME"

      # Release build targeting the simulator SDK — no code signing required.
      # arm64 only (Apple Silicon runner) cuts ~40% off the compile vs a fat binary.
      # Tee the full log to a file so it can be uploaded as an artifact on failure.
      - name: Build .app for the simulator
        working-directory: packages/mobile/ios
        # Expo's @ExpoModule scan has a fixed 5 s limit and times out on a busy runner
        # ("Scanning for @ExpoModule classes didn't complete ... Build again to retry").
        # Retry the build once for that error only; any other failure fails at once.
        run: |
          set -o pipefail
          build() {
            xcodebuild \
              -workspace "${{ steps.xcode.outputs.workspace }}" \
              -scheme "${{ steps.xcode.outputs.scheme }}" \
              -sdk iphonesimulator \
              -configuration Release \
              -arch arm64 \
              -derivedDataPath build \
              CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO CODE_SIGNING_ALLOWED=NO \
              build | tee "$GITHUB_WORKSPACE/xcodebuild.log"
          }
          if build; then exit 0; fi
          if ! grep -q "Scanning for @ExpoModule classes didn't complete" "$GITHUB_WORKSPACE/xcodebuild.log"; then exit 1; fi
          echo "::warning::Expo module scan timed out; building once more."
          build

      # Locate the built .app and fail loudly with a clear message if it's missing.
      - name: Locate built .app
        working-directory: packages/mobile/ios
        run: |
          APP_PATH=$(find build/Build/Products -name "*.app" -type d | head -1)
          if [ -z "$APP_PATH" ]; then
            echo "::error::No .app bundle found under packages/mobile/ios/build/Build/Products — the xcodebuild step did not produce a simulator app. Check xcodebuild.log."
            exit 1
          fi
          echo "APP_PATH=$(cd "$(dirname "$APP_PATH")" && pwd)/$(basename "$APP_PATH")" >> "$GITHUB_ENV"
          echo "Found app: $APP_PATH"

      # The simulator build is the reusable product of this workflow: zip it (ditto keeps the
      # bundle's symlinks and metadata, which a plain zip drops) and publish it under a name
      # that carries the built commit, so a session can pick the build for any ref.
      - name: Zip the simulator .app
        id: app
        run: |
          SHORT_SHA=$(git rev-parse --short=8 HEAD)
          ditto -c -k --keepParent "$APP_PATH" "$RUNNER_TEMP/festie-simulator.app.zip"
          echo "artifact_name=ios-simulator-app-$SHORT_SHA" >> "$GITHUB_OUTPUT"

      # Artifacts on a public repo are downloadable by any signed-in GitHub user, and the .app
      # embeds the licensed display fonts. Upload it only when a session asks for it, and keep it
      # for one day.
      - name: Upload simulator .app
        if: inputs.upload_app == true
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ steps.app.outputs.artifact_name }}
          path: ${{ runner.temp }}/festie-simulator.app.zip
          retention-days: 1
          if-no-files-found: error

      - name: Install .app into the booted simulator
        if: env.RUN_MAESTRO == 'true'
        run: xcrun simctl install "${{ steps.sim.outputs.udid }}" "$APP_PATH"

      - name: Install Maestro
        if: env.RUN_MAESTRO == 'true'
        run: |
          # Pinned release zip with a checksum, not the unpinned get.maestro.mobile.dev installer.
          curl -fsSL -o "$RUNNER_TEMP/maestro.zip" "https://github.com/mobile-dev-inc/maestro/releases/download/cli-2.12.1/maestro.zip"
          echo "54dbb0716425626604973cbb374c585ca30272375d9ce15177a1152765ddd9d7  $RUNNER_TEMP/maestro.zip" | sha256sum -c -
          unzip -q "$RUNNER_TEMP/maestro.zip" -d "$HOME/.maestro-install"
          echo "$HOME/.maestro-install/maestro/bin" >> "$GITHUB_PATH"

      - name: Bisect the empty tree by launch argument (TEMPORARY)
        if: inputs.probe == true && inputs.probe_mode == 'bisect'
        working-directory: packages/mobile
        run: |
          UDID="${{ steps.sim.outputs.udid }}"
          for v in none offline sos live announce toaster sheet eb wrap tabsview offline,sos,live,announce,toaster,sheet eb,wrap,tabsview,offline,sos,live,announce,toaster,sheet; do
            xcrun simctl terminate "$UDID" us.festie.app >/dev/null 2>&1 || true
            sleep 3
            xcrun simctl launch "$UDID" us.festie.app -probeoff "$v" >/dev/null
            sleep 40
            MAESTRO_CLI_NO_ANALYTICS=1 maestro hierarchy > "h.json" || true
            echo "VARIANT $v nodes=$(grep -c '"attributes"' h.json) ids=$(grep -cE '"resource-id" : "[a-z]' h.json) tabbar=$(grep -c 'Tab Bar' h.json)"
          done
          mv h.json maestro-ios-hierarchy-probe-45s.json

      - name: Run probe flow (TEMPORARY)
        if: inputs.probe == true && inputs.probe_mode != 'bisect'
        working-directory: packages/mobile
        continue-on-error: true
        run: |
          xcrun simctl launch "${{ steps.sim.outputs.udid }}" us.festie.app || true
          sleep 45
          MAESTRO_CLI_NO_ANALYTICS=1 maestro hierarchy > maestro-ios-hierarchy-probe-45s.json || true
          grep -c '"attributes"' maestro-ios-hierarchy-probe-45s.json || true
          grep -E '"(resource-id|accessibilityText)" : "[^"]+"' maestro-ios-hierarchy-probe-45s.json || true
          PROBE=.maestro/ios-probe.yaml
          if [ "${{ inputs.probe_mode }}" = "no-intro" ]; then PROBE=.maestro/ios-probe-nointro.yaml; fi
          MAESTRO_CLI_NO_ANALYTICS=1 maestro test $PROBE --test-output-dir="$PWD/maestro-ios-debug" || true
          MAESTRO_CLI_NO_ANALYTICS=1 maestro hierarchy > maestro-ios-hierarchy.json || true

      - name: Run Maestro flows (iOS)
        if: env.RUN_MAESTRO == 'true' && inputs.probe != true
        working-directory: packages/mobile
        env:
          # Passed to Maestro so the authed phase of the smoke runs; CI provides
          # them from repo secrets. The artist-sheet flow is guest-level and gets none.
          TEST_USERNAME: ${{ secrets.TEST_USERNAME }}
          TEST_PASSWORD: ${{ secrets.TEST_PASSWORD }}
          # On the FIRST run against a fresh sim, Maestro has to build + install
          # its xcuitest XCTest runner before the flow starts; the default driver
          # startup window is too short on a cold macOS runner and throws
          # IOSDriverTimeoutException ("iOS driver not ready in time"). Give it a
          # generous window (240s) and retry once — the runner is installed by the
          # first (failed) attempt, so the retry starts instantly.
          MAESTRO_DRIVER_STARTUP_TIMEOUT: '240000'
        run: |
          set -o pipefail
          # run_flow <flow> <debug dir> <junit report> <log> [extra maestro args...]
          run_flow() {
            local flow="$1" debug="$2" report="$3" log="$4"
            shift 4
            run_maestro() {
              MAESTRO_CLI_NO_ANALYTICS=1 maestro test "$@" \
                --test-output-dir="$PWD/$debug" \
                --debug-output="$PWD/$debug" \
                --flatten-debug-output \
                --format junit \
                --output "$report" \
                "$flow"
            }
            if ! run_maestro "$@" 2>&1 | tee "$log"; then
              if grep -Eq 'IOSDriverTimeoutException|iOS driver not ready' "$log"; then
                echo "::warning::Cold iOS driver startup failed; retrying once."
                sleep 10
                run_maestro "$@" 2>&1 | tee -a "$log"
              else
                return 1
              fi
            fi
          }
          # Run both flows even if the first fails, then fail the step.
          status=0
          run_flow .maestro/ios-smoke.yaml maestro-ios-debug maestro-ios-report.xml maestro-ios.log \
            -e TEST_USERNAME="$TEST_USERNAME" \
            -e TEST_PASSWORD="$TEST_PASSWORD" || status=1
          run_flow .maestro/ios-artist-sheet.yaml maestro-ios-artist-debug maestro-ios-artist-report.xml maestro-ios-artist.log || status=1
          exit "$status"

      - name: Verify route screenshot coverage
        if: env.RUN_MAESTRO == 'true' && inputs.probe != true
        working-directory: packages/mobile
        run: |
          SCREENSHOT_DIR=maestro-ios-debug/screenshots
          COUNT=$(find "$SCREENSHOT_DIR" -maxdepth 1 -type f -name '[0-9][0-9]-*.png' | wc -l | tr -d ' ')
          UNIQUE=$(find "$SCREENSHOT_DIR" -maxdepth 1 -type f -name '[0-9][0-9]-*.png' -exec shasum -a 256 {} \; | awk '{print $1}' | sort -u | wc -l | tr -d ' ')
          echo "screenshots=$COUNT unique=$UNIQUE"
          test "$COUNT" -ge 21 || { echo "::error::Expected at least 21 route screenshots"; exit 1; }
          test "$UNIQUE" -ge 15 || { echo "::error::Screenshots are not diverse enough; navigation likely stalled"; exit 1; }

      # On failure, save what XCUITest exposes on the screen the flow stopped on,
      # because the debug tree is scrubbed to screenshots below.
      - name: Dump the iOS view hierarchy on failure
        if: failure() && env.RUN_MAESTRO == 'true'
        working-directory: packages/mobile
        env:
          TEST_USERNAME: ${{ secrets.TEST_USERNAME }}
          TEST_PASSWORD: ${{ secrets.TEST_PASSWORD }}
        run: |
          out=maestro-ios-hierarchy.json
          MAESTRO_CLI_NO_ANALYTICS=1 maestro hierarchy > "$out" || echo "::warning::maestro hierarchy failed"
          # The artifact is public: drop the dump if a typed credential is on screen.
          for secret in "$TEST_USERNAME" "$TEST_PASSWORD"; do
            if [ -n "$secret" ] && grep -qiF -- "$secret" "$out" 2>/dev/null; then
              rm -f "$out"
              echo "::warning::Hierarchy held a test credential and was not uploaded"
              break
            fi
          done

      # Maestro records every -e value in commands-*.json and maestro.log.
      # Keep only screenshots in the debug tree so Actions artifacts can never
      # publish the smoke credentials from this public repository.
      - name: Remove credential-bearing Maestro metadata
        if: always() && env.RUN_MAESTRO == 'true'
        working-directory: packages/mobile
        run: |
          for dir in maestro-ios-debug maestro-ios-artist-debug; do
            if [ -d "$dir" ]; then
              find "$dir" -type f ! -path '*/screenshots/*.png' -delete
            fi
          done

      - name: Upload Maestro artifacts
        if: always() && env.RUN_MAESTRO == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ios-maestro-results
          path: |
            packages/mobile/*.png
            packages/mobile/maestro-ios-report.xml
            packages/mobile/maestro-ios-artist-report.xml
            packages/mobile/maestro-ios-hierarchy.json
            packages/mobile/maestro-ios-hierarchy-probe-45s.json
            packages/mobile/maestro-ios-debug/**
            packages/mobile/maestro-ios-artist-debug/**
            !packages/mobile/maestro-ios-debug/commands-*.json
            !packages/mobile/maestro-ios-debug/maestro.log
            !packages/mobile/maestro-ios-artist-debug/commands-*.json
            !packages/mobile/maestro-ios-artist-debug/maestro.log
          if-no-files-found: error

      # Publish the Maestro JUnit report as a PR/run check annotation so failures
      # surface inline. if: always() + continue-on-error: true ensures this step
      # never fails the gate — it is purely informational trend tracking.
      - name: Publish Maestro test results
        if: always() && env.RUN_MAESTRO == 'true'
        continue-on-error: true
        uses: dorny/test-reporter@d1b5dff021aa968b288b02285a8bf47471c5928a # v3.2.0
        with:
          name: iOS Maestro Results
          path: packages/mobile/maestro-ios-*report.xml
          reporter: java-junit
          fail-on-error: false

      - name: Upload xcodebuild log
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ios-xcodebuild-log
          path: xcodebuild.log
          if-no-files-found: ignore
